major_decisions:
  tempo_meter_form: 116 BPM, 4/4, 28 compases; A/B/A'/coda (8/8/8/4).
  harmony: D minor/D Aeolian; Dm-Bb-C-Gm; coda en Dm.
  focal_hierarchy: Patrón armónico sincopado focal; bass de apoyo; lead breve/espaciado.
  development: Patrón retorna con cambios de posiciones/omisiones y soporte armónico por sección.
  ending: Coda reduce actividad y termina con D minor/D en bajo; no se declara cadencia ni se infiere cierre por el acorde solo.
