example_id: SONG-001
example_kind: audited_composition_with_controlled_revision
epistemic_status: case_example_not_general_evidence
brief: Instrumental indie-dance; continuidad con intensificación gradual, foco reconocible y release relativamente abierto.
major_decisions:
  tempo_meter_form: 122 BPM, 4/4, 16 compases; opening/build/focal/release de cuatro compases cada uno.
  harmony: C major/Ionian context; ciclo C-Am-F-G persistente.
  focal_hierarchy: Lead focal; bajo de apoyo raíz/quinta; texture sincopada por secciones.
  development: Variación parcial de lead y cambios de capas/densidad; release reduce textura.
  ending: G4 sostenido sobre el ciclo; intención relativamente abierta, no claim de cierre perceptivo.
artistic_priority_handoffs: 7
percussion:
  outcome: OMITTED_ACCIDENTALLY
  n3p_in_song: not_explicitly_resolved
  interpretation: Omisión de aplicación/integración, no evidencia de que drums sean innecesarios.
important_guardrails:
  - No confundir intención de release con cierre percibido.
  - Los timbres de FM8 son contexto de escucha, no prueba de género o conocimiento.
songplan_result:
  status: validated_and_materialized
  schema: SongPlanV2
  validation: PASS
  midi: compositions/SONG-001/SONG-001.mid
