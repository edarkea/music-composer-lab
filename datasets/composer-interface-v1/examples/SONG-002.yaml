example_id: SONG-002
example_kind: audited_composition
epistemic_status: case_example_and_owner_artistic_preference_not_scientific_validation
brief: Indie-dance; movimiento rítmico, con espacio para bajo/groove y desarrollo por secciones.
major_decisions:
  tempo_meter_form: 118 BPM, 4/4, 28 compases; threshold/pulse/lift/focal/afterglow (4/8/4/8/4).
  harmony: A Dorian; ciclo Am9-D6-Am9-G6; afterglow G6-D6-Am9-Am9.
  focal_hierarchy: Bajo percibido como protagonista de groove; lead más espaciado.
  development: Células de bajo y actividad de groove cambian; percepciones alrededor de bars 5, 13 y 19 (19 es retorno local dentro de focal).
  ending: Afterglow con Am9 prolongado.
artistic_priority_handoffs: 8
percussion:
  n3p: {prospective: true, manual_drums_reminder: false, outcome: MINIMAL, owner_accepted: true}
  realization: Kick, closed hat y rimshot escaso en relación estrecha con bajo.
important_guardrails:
  - Percusión mínima es decisión local; no superioridad general ni obligación de género.
  - Lead menos activo no establece una regla universal de jerarquía.
  - FM8 ambient/spatial es contexto de reproducción.
  - Las alturas explícitas rigen la sonoridad materializada.
