example_id: SONG-003
example_kind: audited_composition
epistemic_status: case_example_and_owner_artistic_preference_not_scientific_validation
brief: Indie-dance instrumental con identidad recurrente, desarrollo entre capas y claridad de groove.
major_decisions:
  tempo_meter_form: 132 BPM, 4/4, 24 compases; spark/stride/pocket/lift/arrival/button (4/6/4/2/6/2).
  harmony: E Mixolydian; seis triadas realizadas explícitamente, una asignación por compás.
  focal_hierarchy: Relación compartida lead-percussion/cowbell; bajo comparativamente sencillo.
  lead: Identidad recurrente con cortes y variaciones.
  development: Cambia la realización rítmica armónica; retirada en pocket y reentrada.
  ending: Button breve en E.
artistic_priority_handoffs: 8
percussion:
  n3p: {prospective: true, manual_drums_reminder: false, outcome: FULL, owner_accepted: true}
  realization: Kick/snare/hat/cowbell; FULL no significa subdivisión continua.
important_guardrails:
  - Silencio rítmico no es defecto automático.
  - El hueco de bar 18 no es error MIDI/materialización ni necesidad de rellenar.
  - No generalizar que hats continuos o toms sean innecesarios.
