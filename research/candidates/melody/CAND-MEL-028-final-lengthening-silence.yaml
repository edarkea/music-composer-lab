id: CAND-MEL-028
status: candidate
compositional_problem: "Contribuir rítmicamente al cierre de frase sin depender solo de pitch o armonía."
claim: "Alargar la duración final y dejar silencio post-evento contribuye al cierre como condición coordinada: los oyentes demoran límites en producción auto-pautada (Kragness & Trainor, músicos y no-músicos, mayor con contexto tonal) y los silencios tras cierre tonal se detectan más rápido y se juzgan menos tensos (Margulis MP). Ninguno de los dos es necesario ni suficiente; la armonía probablemente decide (cross-domain)."
structural_variable: "final duration + post-event silence (duración final y silencio posterior)"
possible_action: "Alargar el evento final y dejar silencio tras él cuando se busca cierre, coordinando con resolución armónica y posición métrica; no esperar que duración o silencio cierren solos."
expected_effect: "Cierre apoyado rítmicamente; evaluable por escucha."
evidence_class: HYPOTHESIS
support_basis:
  - EXTERNAL_EMPIRICAL
sources:
  - SRC-EMPIRICAL-011
  - SRC-EMPIRICAL-010
context_dependencies:
  - Marco armónico que resuelva o no (cross-domain; RQ-MEL-007).
  - Posición métrica/formal del final; contexto tonal previo.
counterproductive_conditions:
  - Alargar + callar sobre armonía irresuelta esperando cierre.
  - Alargamientos que se lean como fermata expresiva sin función de cierre.
alternatives:
  - Cierre por repetición/asentamiento o descenso con soporte (cf. CAND-MEL-017).
uncertainty_confidence: "Media-baja: demora en límites y silencio post-cierre convergentes; tareas distintas (producción vs. juicio); transferencia compositiva, inferencia."
genre_sensitivity: "Corales de Bach + extractos variados; prudencia fuera de tonal occidental."
evaluation_falsification: "Finales alargados con silencio y armonía resuelta que sistemáticamente no cierren, o cierres fuertes sin alargamiento ni silencio en igualdad de contexto, matizarían el claim (ya contempla ambas vías)."
structure_perception_composition:
  structure: "Duración final mayor + silencio posterior."
  perception: "Demora en límites; silencio post-cierre rápido de detectar y menos tenso."
  composition: "Heurística: alargar y callar como contribución al cierre, con armonía."
