id: CAND-MEL-014
status: candidate
compositional_problem: "Dar forma de frase sin confiarlo todo al contorno."
claim: "Los juicios de frase combinan contribuciones de la información de pitch y de la información temporal de forma conjunta (aditiva en el estudio citado); el contorno NO fue aislado por Palmer & Krumhansl —su condición de pitch conserva intervalos y marco tonal—, por lo que nada en esa fuente atribuye la función de frase al contorno específicamente. El timing y la armonía contribuyen por vía propia."
structural_variable: "pitch pattern + temporal pattern (patrón de alturas y patrón temporal)"
possible_action: "Al diseñar fraseo, coordinar contorno con timing (duraciones, posición métrica) y marco armónico en lugar de esperar que el contorno porte la función solo."
expected_effect: "Fraseo sostenido por varias dimensiones; cada una evaluable por separado en escucha."
evidence_class: HYPOTHESIS
support_basis:
  - EXTERNAL_EMPIRICAL
sources:
  - SRC-EMPIRICAL-004
context_dependencies:
  - Repertorio clásico medido; oyentes universitarios.
  - Familiaridad y timing interpretativo modulan (misma fuente).
counterproductive_conditions:
  - Cambiar pitch y timing a la vez esperando atribuir el efecto a uno (cf. EXP-001 F).
alternatives:
  - Confiar el fraseo a un solo parámetro por decisión estética (entonces ARTISTIC PREFERENCE).
uncertainty_confidence: "Media-baja: aditividad medida en juicios de frase clásica; transferencia compositiva, inferencia."
genre_sensitivity: "Desconocida fuera del repertorio medido."
evaluation_falsification: "Juicios de frase explicados totalmente por un solo parámetro (pitch o tiempo) de forma replicable debilitarían la aditividad."
structure_perception_composition:
  structure: "Patrón de alturas y patrón temporal manipulables por separado."
  perception: "Pitch y tiempo contribuyen conjuntamente al juicio de frase; el contorno no fue aislado como variable."
  composition: "Heurística justificada: coordinar dimensiones; no cargar la función al contorno solo."
