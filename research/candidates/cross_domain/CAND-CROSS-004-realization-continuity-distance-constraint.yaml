id: CAND-CROSS-004
status: candidate
compositional_problem: "Encontrar un criterio valido para comparar realizaciones armonicas cuando el objetivo es continuidad entre sonoridades sucesivas."
claim: "La evidencia inspeccionada no valida perceived musical distance, analytical voice-leading distance, common-tone retention, roughness, similarity ni voice-stream continuity como proxies automaticos de continuidad compositiva. Perceived musical distance entre sonoridades sucesivas si constituye un objetivo perceptivo mas estrecho y operacionalizable bajo tareas secuenciales acotadas: en pares de trichords, el movimiento total y la retencion de tonos comunes influyeron en ratings de distance, pero la metrica taxicab no fue suficiente. Este objetivo no es una operacionalizacion validada de continuity ni evidencia de un ranking de realizaciones con la armonia mantenida constante."
structural_variable: "realized voice displacement, common-tone retention, direction, number of moving voices, register, spacing and voice allocation"
possible_action: "Antes de comparar realizaciones, declarar si el criterio es continuity o, como objetivo independiente y mas estrecho, perceived musical distance; no sustituir el primero por el segundo. No rankear voicings para continuity desde suma de movimiento, tonos comunes, roughness, similarity o streaming sin validacion de transferencia; para perceived distance, usar unicamente tareas y controles dentro del alcance de la evidencia."
expected_effect: "Filtrar criterios analiticos o acusticos que no correspondan al objetivo secuencial y preparar una comparacion futura con alcance explicito."
evidence_class: COMPOSITION_HEURISTIC
support_basis: [EXTERNAL_EMPIRICAL, THEORETICAL_SCHOLARSHIP]
sources:
  - SRC-EMPIRICAL-029
  - SRC-EMPIRICAL-030
  - SRC-EMPIRICAL-031
  - SRC-EMPIRICAL-032
context_dependencies: "Tarea de distance o continuity, pares de sonoridades, numero de voces, timbre, registro, spacing, afinacion, contexto tonal, melodia, bajo y escala de textura."
counterproductive_conditions: "Tratar perceived distance como continuity; minimizar movimiento universalmente; asumir que tonos comunes, roughness, consonance o preference determinan conexion armonica."
alternatives: "Rating de distance, tarea de connectedness si se identifica, seguimiento de voice-streams, expectancy o una medida futura directamente validada."
uncertainty_confidence: "Media para distance percibida en el paradigma de trichords; baja para continuity compositiva y transferencia a textura popular."
genre_sensitivity: "Alta entre trichords sinteticos, secuencias tonales occidentales y realizacion popular; transferencia popular UNKNOWN."
evaluation_falsification: "Una fuente directa que mida distance y continuity en los mismos estimulos, o que valide menor distance como mayor continuity bajo una tarea secuencial y realizaciones comparables, permitiria revisar la restriccion; una comparacion controlada que no reproduzca los efectos de distance dentro del alcance declarado exigiria acotar tambien el objetivo perceptivo estrecho."
structure_perception_composition:
  structure: "Realizaciones sucesivas con desplazamientos, tonos comunes, registro, spacing y asignacion declarados."
  perception: "Ratings de distance, expectancy, consonance o streaming segun tarea; no se colapsan en continuity."
  composition: "Seleccionar un criterio declarado para futuras comparaciones sin elevar una metrica analitica a regla de voicing."
phase2_candidate_type: CONSTRUCT_TRANSFER_CONSTRAINT
audit_outcome: REVISE
promotion_readiness: POSSIBLE_WITH_SCOPE
audit_status: COMPLETED
audit_evidence_gate: PASS
audit_note: "La auditoria elimina los puentes PARTIAL no demostrados hacia continuity. Perceived distance queda como criterio alternativo independiente, no como operacionalizacion de continuidad. Rogers/Callender no aisla realizaciones alternativas de la misma seleccion armonica; por ello aporta constructo perceptivo y no ranking de voicings. No se crea CAND-CROSS-005: la restriccion y la delimitacion del criterio alternativo son coherentes en un solo candidato."
