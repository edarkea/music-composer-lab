structure_perception_composition:
  structure: "Marco cíclico con modificación formal en otros dominios o en una iteración marcada."
  perception: "No se mide aquí cuándo el ciclo se oye como sección, retorno o cierre."
  composition: "El objetivo permite filtrar persistencia/cambio sin imponer sintaxis dirigida."
