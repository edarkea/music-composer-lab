id: CAND-HAR-023
status: candidate
compositional_problem: "Decidir si acelerar (o desacelerar) la actividad armónica produce continuación, llegada, tensión o energía."
claim: "La aceleración del ritmo armónico es un dispositivo dependiente de tradición y contexto formal, no un generador universal de tensión o energía. Mitad positiva acotada: en la continuation de la sentence clásica (Haydn/Mozart/Beethoven instrumental) la aceleración armónica participa en la continuación hacia la función cadencial junto a fragmentación y liquidación (Caplin). Mitad negativa: fuera de ese alcance nada establece que acelerar aumente tensión, energía o fuerza de llegada, ni que desacelerar estabilice; FASTER != MORE TENSION, FASTER != MORE ENERGY, CADENTIAL ACCELERATION != UNIVERSAL CLOSURE SIGNAL."
structural_variable: "harmonic-change rate trajectory (acceleration/deceleration of changes per declared unit U, window W and tempo T) evaluated within stated formal tradition and phrase function"
possible_action: "Fuera de pastiche clásico: no acelerar por defecto antes de llegadas ni usar la tasa como mando de tensión/energía; si se acelera, verificar por escucha y declarar la alternativa (densificar superficie sin cambiar armonía)."
expected_effect: "Evitar actividad sin dirección; dentro del scope clásico, continuación hacia cadencia (efecto analítico, no perceptivo medido)."
evidence_class: THEORY
support_basis:
  - THEORETICAL_SCHOLARSHIP
  - COMPOSITION_PEDAGOGY
sources:
  - SRC-THEORETICAL-002
  - SRC-PEDAGOGICAL-001
context_dependencies:
  - Función formal de continuation clásica para la mitad positiva (presentación previa + meta cadencial).
  - Meta funcional declarada para cualquier uso direccional (dependencia RQ-HAR-002/005).
  - Tempo y densidad controlados conceptualmente (dependencia CAND-HAR-021).
counterproductive_conditions:
  - Acelerar sin meta funcional (produce actividad sin dirección).
  - Importar el vocabulario (liquidación, continuation) al pop sin verificar.
alternatives:
  - Densificar superficie/arreglo manteniendo la tasa armónica.
  - Fragmentación melódica sin aceleración armónica (corte situado, no dirección).
uncertainty_confidence: "Media-baja: mitad positiva THEORY acotada a la sentence clásica con apoyo VERIFIED (Caplin; Schoenberg-pedagogía para presentación); mitad negativa como heurística negativa con ausencia delimitada (ninguna medida perceptiva inspeccionada; transferencias bloqueadas CAND-MEL-027/030, CAND-HAR-012). Clasificación THEORY-derived de tradición, no heurística general. Desaceleración `uncertain` en todo alcance."
genre_sensitivity: "Alta: el dispositivo pertenece a la sentence clásica; loops pop con aceleración local `uncertain` (pregunta abierta, no conclusión)."
evaluation_falsification: "Medida donde oyentes enculturados juzguen sistemáticamente mayor tensión/energía ante tasa armónica aislada (tempo, densidad y arreglo fijos) exigiría reformular la mitad negativa; corpus pop de aceleración pre-cierre exigiría acotar el alcance."
structure_perception_composition:
  structure: "Trayectoria de la tasa de cambios armónicos dentro de una función formal declarada."
  perception: "Ninguna medida inspeccionada vincula aceleración con tensión/energía percibidas; Caplin es analítico, no perceptivo."
  composition: "Heurística negativa justificada fuera del scope + uso acotado dentro del scope clásico; desaceleración sin recomendación."
audit_recommendation: REVISE
integration_readiness: POSSIBLE_WITH_SCOPE
verification_note: "Audit COMPLETED (2026-09-04): scope clásico sentence/continuation declarado; aceleración no define continuation por sí sola ni causa tensión/energía/llegada; tasa explicitada en U/W/T (cruce 021); alcance CAND-MEL-009 alineado sin modificar Melody."
