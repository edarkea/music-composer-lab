audit_recommendation: REVISE
integration_readiness: POSSIBLE_WITH_SCOPE
verification_note: "AUDIT COMPLETED (2026-09-04, RQ-HAR-006): BUNDLING AUDIT — un solo claim retenido con núcleo unificado CENTER/COLLECTION y evidencia separada por tradición (clásica VERIFIED + pop VERIFIED + corpus PARTIAL); sin SPLIT, sin CAND-HAR-040; preservación de función como reclamación de marco; audición de fuente por oyentes sin medida."
