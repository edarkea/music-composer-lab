id: CAND-HAR-008
status: candidate
compositional_problem: "Crear una llegada dirigida fuerte hacia un centro sin suponer que toda música la necesita."
claim: "V→I ocupa un rol cadencial/funcional privilegiado solo dentro de tradiciones acotadas (frase de práctica común y repertorios compatibles): allí puede confirmar un centro plausible con convergencia de leading tone, bajo en 5̂, conducción y posición. No es un requisito universal: centros modales, loops y tónicas ausentes documentados funcionan sin V→I, de modo que exigirlo fuera de su alcance es un error de scope. La mitad positiva (privilegio dentro de su tradición) descansa en marcos teóricos/pedagógicos convergentes sin texto inspeccionado; la mitad negativa (no universal) descansa en contraevidencia inspeccionada."
structural_variable: "dominant-to-tonic motion (scale degree 5 sonority with converging cues → tonic) within bounded traditions"
possible_action: ""
expected_effect: "CONFIRM / llegada dirigida dentro de su tradición; fuera de ella, efecto incierto o retonalizante."
evidence_class: THEORY
support_basis:
  - THEORETICAL_SCHOLARSHIP
  - COMPOSITION_PEDAGOGY
  - REPERTOIRE_ANALYSIS
sources:
  - SRC-PEDAGOGICAL-005
  - SRC-PEDAGOGICAL-006
  - SRC-PEDAGOGICAL-007
  - SRC-PEDAGOGICAL-008
  - SRC-ACADEMIC-028
  - SRC-ACADEMIC-029
  - SRC-ACADEMIC-031
context_dependencies:
  - Frase de práctica común o repertorio compatible (centro ya plausible).
  - Convergencia de indicios (basso en 5̂, conducción, posición); V→I aislado sin contexto no basta.
  - Oyentes enculturados en la tradición correspondiente.
counterproductive_conditions:
  - Exigir V→I en pop/modal/loops (retonaliza o impone sintaxis ajena; ver CAND-HAR-006/011).
  - Leer confirmación donde solo hay etiqueta V sin comportamiento (ver CAND-HAR-007).
alternatives:
  - Retorno modal (♭VII–I) o plagal (IV–I) en tradiciones correspondientes.
  - Aserción melódica / pedal como confirmación no funcional (CAND-HAR-006).
uncertainty_confidence: "Media-baja para la acotación global; baja para la fuerza positiva aislada: la descripción tradicional es convergente pero los records pedagógicos están PARCIAL sin texto inspeccionado y ningún apoyo perceptivo dedicado aísla V→I como llegada (Huron solo marco general de familiaridad; probe-tone no mide llegada; Doll pre-tónica describe expectativa aun sin resolución). La acotación negativa (no universal) descansa en contraevidencia inspeccionada (Spicer, Everett, Doll vía reseña; ver CAND-HAR-006). possible_action vacío: el puente compositivo positivo requiere percepción + contexto no medidos. No prescribe V→I para resolver; no afirma que V→I suene resuelto universalmente."
genre_sensitivity: "Muy alta: claim con scope clásico declarado; fuera de él solo como hipótesis de transferencia no verificada."
evaluation_falsification: "Tradición de práctica común donde V→I con indicios convergentes no confirme el centro exigiría reformular la fuerza del claim dentro de su propio scope."
structure_perception_composition:
  structure: "Sonoridad sobre 5̂ con indicios convergentes seguida de tónica en posición de llegada."
  perception: "Familiaridad modula expectativa (Huron, repo, general); jerarquías de grados (probe-tone) sin medida de llegada; pre-tónica como expectativa aun sin resolución (Doll vía reseña). Ninguna medida dedicada de V→I como llegada."
  composition: "Puente compositivo positivo pendiente de apoyo directo: sin acción justificada todavía."
audit_recommendation: REVISE
integration_readiness: POSSIBLE_WITH_SCOPE
verification_note: "Audit COMPLETED (2026-09-03): separación S/P/C reforzada; mitad positiva marcada como dependiente de pedagogía PARCIAL sin texto; mitad negativa apoyada en contraevidencia VERIFIED; cross-ref a CAND-HAR-006 preservada; possible_action permanece vacío."
