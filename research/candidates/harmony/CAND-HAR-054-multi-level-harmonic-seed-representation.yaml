id: CAND-HAR-054
status: candidate
compositional_problem: "Representar el material armonico inicial sin confundir seleccion abstracta con realizacion sonora."
claim: "Antes de fijar voicings, un seed puede describirse mediante centro o coleccion, relaciones de raiz, funcion bajo un marco declarado, region, loop, vamp, pedal, bajo, voces comunes o ritmo armonico; cada representacion deja abiertas variables distintas."
structural_variable: "Nivel de representacion elegido para la seleccion armonica."
possible_action: "Mantener varias representaciones paralelas y posponer la realizacion hasta conocer las restricciones relevantes."
expected_effect: "Evitar que una etiqueta de acorde o un voicing accidentalmente cierre decisiones que aun no se han tomado."
evidence_class: COMPOSITION_HEURISTIC
support_basis: "La distincion seleccion-realizacion y los analisis de sistemas tonales, loops, centros emergentes y funciones formales muestran niveles analiticos no equivalentes."
sources:
  - SRC-ACADEMIC-029
  - SRC-ACADEMIC-030
  - SRC-ACADEMIC-028
  - SRC-ACADEMIC-031
context_dependencies: "La utilidad de cada representacion depende del marco teorico, la instrumentacion y la funcion compositiva."
counterproductive_conditions: "Multiplicar representaciones puede aumentar complejidad sin mejorar una decision concreta; una funcion no declarada puede aparentar objetividad."
alternatives: "Trabajar directamente con sonoridad, melodia, bajo o textura cuando esos elementos sean el problema principal."
uncertainty_confidence: "Media."
genre_sensitivity: "Media-alta; las categorias funcionales son mas transferibles dentro de marcos compartidos."
evaluation_falsification: "Comprobar si separar niveles permite generar mas alternativas utiles y detectar conflictos entre raiz, bajo, centro, funcion y sonoridad."
structure_perception_composition:
  structure: "Descripcion abstracta del seed y sus grados de libertad."
  perception: "Sonoridad, direccion, estabilidad o ambiguedad resultantes; no equivalen automaticamente a la etiqueta."
  composition: "Eleccion del nivel que mejor sirve a la decision actual y realizacion posterior."
cross_references:
  - CAND-HAR-040
  - CAND-HAR-041
  - CAND-HAR-049
audit:
  outcome: REVISE
  readiness: NOT_READY
  audited_claim: "El material armonico inicial puede especificarse a distintos niveles de abstraccion, dejando abiertas decisiones de realizacion diferentes."
  correction: "No presentar las representaciones como independientes, equivalentes o necesarias en conjunto. La idea es compositivamente util solo cuando ayuda a decidir que variable debe quedar abierta."
  possible_action_audit: "La accion actual es principalmente diagnostica y de representacion. No hay evidencia suficiente para afirmar que mantener representaciones paralelas mejore la construccion."
  structure_perception_composition: "La estructura abstracta y la sonoridad realizada deben separarse; no se justifica un efecto perceptivo ni una preferencia por un nivel."
  source_limitations: "Los registros apoyan distinciones analiticas y de repertorio, no una ventaja compositiva medida de esta arquitectura de representacion."
