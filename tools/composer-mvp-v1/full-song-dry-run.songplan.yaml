          - {bar: 1, beat: "2", duration: "1/4", pitches: [G4], velocity: 84}
          - {bar: 1, beat: "3", duration: "1/2", pitches: [A4], velocity: 88}
          - {bar: 2, beat: "1", duration: "1/2", pitches: [E4], velocity: 82}
