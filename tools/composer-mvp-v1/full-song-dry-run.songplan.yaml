schema_version: "2.0"
name: composer_mvp_v1_full_song_dry_run
tempo: 124
time_signature: 4/4
tonic: C
mode: ionian
style: indie_dance_mvp_dry_run
arrangement:
  sections:
    - id: opening
      start_bar: 1
      bar_count: 2
      energy: 0.3
    - id: build
      start_bar: 3
      bar_count: 2
      energy: 0.5
    - id: focal
      start_bar: 5
      bar_count: 2
      energy: 0.8
    - id: release
      start_bar: 7
      bar_count: 2
      energy: 0.4
