schema_id: staged-composer-stage-3-songplan-serialization-v1
version: 1.0.0
purpose: Serialización del material congelado al contrato SongPlanV2 autoritativo.
required_inputs:
  - frozen_decision_trace_hash
  - frozen_material_hash
  - songplan_v2_contract
allowed_operation: serialize_only
prohibited_operations:
  - choose_new_harmony
  - change_form
  - change_n3_p
  - rewrite_motif_for_artistic_reasons
validation:
  - exact_songplan_v2_root
  - section_ranges
  - track_references
  - motif_assignments
  - event_structure
  - pitch_formats
  - drum_voice_validity
  - harmonic_label_explicit_voicing_integrity
  - handoff_consistency
retry:
  max_attempts: 3
  diagnostics_only: true
  semantic_repair: false
