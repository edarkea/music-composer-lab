  - id: CK-FORM-01
    name: Función formal aporta información del objetivo
    domain: form
    decision_level: local_section_song
    scope: Separar función formal de posición, función armónica y función percibida.
    question: ¿Qué función y escala tiene la unidad y qué operaciones contradicen el objetivo declarado?
    goals: [usar función como información para orientar filtros]
    options: [establish, continue, prepare, arrive, open, contrast, return cuando proceda]
    hard_constraints: Solo contradicciones explícitas al objetivo constituyen restricción dura.
    soft_criteria: Compatibilidad de opciones con rol formal declarado.
    structural_basis: Asignar rol y escala a una unidad.
    perceptual_basis:
      status: may_diverge_from_analysis
      claim: El rol analítico no garantiza función percibida.
    composition_basis: Orientar y filtrar opciones con la función; no determinar el medio.
    evidence_class: COMPOSITION_HEURISTIC
    support_basis: [THEORETICAL_SCHOLARSHIP, GENRE_ANALYSIS, REPERTOIRE_ANALYSIS]
    capability: {enumerate: true, filter: yes_with_scope, rank: false}
    actionability: ACTIONABLE_WITH_SCOPE
    integration_status: ADMIT_WITH_SCOPE
    genre_dependencies: [forma/escala y alcance estilístico declarados]
    cross_domain_dependencies: [melodía, armonía, groove y textura según rol]
    artistic_priority_conditions: Elegir forma concreta por preferencia artística entre alternativas filtradas.
    ranking_status: Función formal no determina medio ni ranking universal.
    guardrails: [GR-001, GR-008, GR-009]
    expected_effect: Ofrecer información del objetivo para decisiones posteriores; no garantiza percepción de sección.
    songplan_handoff: Posición, función, escala y consecuencias locales explícitas.
    uncertainty: Loop, return, boundary y cadence permanecen conceptos separados.
    provenance:
      canonical_source: research/integrations/composer-knowledge-v1.md
      canonical_id: CK-FORM-01
      canonical_section: D
      supporting_ids: [CAND-FORM-001, CAND-FORM-002, CAND-FORM-005, CAND-FORM-008]

  - id: CK-FORM-02
    name: Llegada, apertura, cierre y frontera son estados separados
    domain: form/melody_harmony
    decision_level: phrase_section_song
    scope: Declarar contexto, tarea y tradición.
    question: ¿La unidad debe llegar, cerrar, permanecer abierta o marcar una frontera?
    goals: [mantener estados separados antes de seleccionar medios]
    options: [arrival, openness, closure, boundary, según intención]
    hard_constraints: No deducir un estado a partir de un solo indicio.
    soft_criteria: Contexto melódico, armónico y formal declarado.
    structural_basis: Registrar arrival_state, closure_state y boundary_state separadamente.
    perceptual_basis:
      status: context_and_task_dependent
      claim: El cierre depende de múltiples indicios y de la tarea.
    composition_basis: Evitar deducciones de cierre desde tónica, duración, descenso o frontera aislados.
    evidence_class: COMPOSITION_HEURISTIC
    support_basis: [THEORETICAL_SCHOLARSHIP, EXTERNAL_EMPIRICAL, GENRE_ANALYSIS]
    capability: {enumerate: true, filter: yes_with_scope, rank: false}
    actionability: ACTIONABLE_WITH_SCOPE
    integration_status: ADMIT_WITH_SCOPE
    genre_dependencies: [contexto y tradición declarados]
    cross_domain_dependencies: [melodía, armonía, forma y eventos finales]
    artistic_priority_conditions: Preferencia artística sobre el carácter deseado cuando medios admisibles permanecen abiertos.
    ranking_status: No se rankea cierre por tónica, final largo, descenso o frontera aislados.
    guardrails: [GR-001, GR-007, GR-008, GR-009]
    expected_effect: Evitar que un único rasgo determine el estado pretendido; escucha posterior conserva autoridad perceptiva.
    songplan_handoff: Estados deseados y operaciones compatibles; fuerza percibida queda en traza/escucha.
    uncertainty: No hay garantía de cierre perceptivo por medios aislados.
    provenance:
      canonical_source: research/integrations/composer-knowledge-v1.md
      canonical_id: CK-FORM-02
      canonical_section: D
      supporting_ids: [CAND-FORM-005]

  - id: CK-CROSS-01
    name: Ranking de reconocimiento bajo una tarea declarada
    domain: melody/recurrence
    decision_level: local_pairwise_rank
    scope: Tarea de reconocimiento/discriminación, familiaridad, representación y comparación declaradas.
    question: ¿Qué variante conserva mejor el reconocimiento en la tarea explícita?
    goals: [preservar reconocimiento de material melódico previamente establecido]
    options: [material intacto, contorno e intervalos relativos preservados, solo contorno preservado]
    hard_constraints: Usar solo si recognition es el criterio activo y coincide el alcance de la evidencia.
    soft_criteria: Ninguno adicional especificado por esta entrada.
    structural_basis: Relaciones de pitch, intervalo y contorno preservadas.
    perceptual_basis:
      status: supported_with_scope
      claim: En la comparación inspeccionada, intacta > contorno+intervalos relativos > solo contorno para reconocimiento.
    composition_basis: Aplicar la comparación únicamente cuando el objetivo explícito sea recognition.
    evidence_class: EXPERIMENTAL_RESULT
    support_basis: [EXTERNAL_EMPIRICAL, CAND-CROSS-003]
    capability: {enumerate: true, filter: yes_with_scope, rank: local_only}
    actionability: ACTIONABLE_WITH_SCOPE
    integration_status: ADMIT_WITH_SCOPE
    genre_dependencies: [tarea y familiaridad declaradas; no transferir ranking a calidad compositiva]
    cross_domain_dependencies: [melody, recurrence, variation]
    artistic_priority_conditions: Novedad, contraste, estilo u otro objetivo distinto pueden justificar una prioridad artística diferente.
    ranking_status:
      level: RANK-1
      scope: Solo comparación local descrita; no es ranking de calidad, memorabilidad, retorno, estilo o composición global.
      actual_uses_in_completed_song_compositions: 0
      rank_2: unsupported
    guardrails: [GR-001, GR-005, GR-007, GR-009]
    expected_effect: La relación preferida se limita a reconocimiento en la tarea comparada.
    songplan_handoff: Registrar invariante/variante y criterio; referir alcance y resultado en DecisionTrace.
    uncertainty: No demuestra superioridad de retorno exacto ni equivalencia o calidad compositiva.
    provenance:
      canonical_source: research/integrations/composer-knowledge-v1.md
      canonical_id: CK-CROSS-01
      canonical_section: D/G
      supporting_ids: [CAND-CROSS-003]

  - id: CK-SONG-01
    name: Contrato explícito de intención y revisión
    domain: song/cross_domain
    decision_level: song_level
    scope: Decisiones song-level/cross-domain y dependencias; contrato de proceso, no claim musical independiente.
    question: ¿Qué intención organiza la decisión y qué dependencia puede reabrirla?
    goals: [declarar intención, alcance, dependencias y base antes del handoff]
    options: [alternativas que sobreviven a restricciones y criterios declarados]
    hard_constraints: No serializar valores musicales no resueltos ni pedir al motor que invente material.
    soft_criteria: Criterios contextualizados; prioridad artística cuando no hay selección única.
    structural_basis: Registrar decisiones, restricciones, dependencias, versiones y cambios.
    perceptual_basis:
      status: not_presumed
      claim: El contrato no determina por sí mismo qué música es mejor.
    composition_basis: Filtrar con base trazable y reabrir solo la decisión mínima afectada por conflicto identificado.
    evidence_class: COMPOSITION_HEURISTIC
    support_basis: [THEORETICAL_SCHOLARSHIP, COMPOSITION_PEDAGOGY, INTEGRATION_CONTRACT]
    capability: {enumerate: true, filter: yes_with_scope, rank: false}
